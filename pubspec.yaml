name: flutter_toastify
description: Customizable animated toast notifications for Flutter with success, error, info and custom styles, progress indicator and action support.
version: 2.0.1
homepage: https://github.com/AbdurrahmanKaraoglu/FlutterToastify
repository: https://github.com/AbdurrahmanKaraoglu/FlutterToastify
issue_tracker: https://github.com/AbdurrahmanKaraoglu/FlutterToastify/issues
topics:
  - toast
  - notification
  - snackbar
  - overlay
  - ui

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
